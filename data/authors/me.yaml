role: PhD Student in Geospatial AI
bio: |
  I am a PhD student at the Technical University of Munich, Chair of
  Cartography and Visual Analytics, supervised by Prof. Liqiu Meng.
  I work where machine learning meets geographic data, with a focus on
  LLM agents and explainable AI. I build multi-agent LLM systems that
  analyse GeoAI models and explain their behaviour,
  and I develop evaluation methods that test whether such explanations
  reflect what a model has actually learned. At Wuhan University I
  worked on coordinating large and small language models to extract
  structured knowledge from geospatial code.

