role: PhD Student in Cartography and GeoAI
bio: |
  I am a PhD student at the Chair of Cartography and Visual Analytics,
  Technical University of Munich, supervised by Prof. Liqiu Meng.
  My research asks how explanations of geospatial AI can become
  understandable, checkable and useful for people outside the modelling
  community. I build LLM-based multi-agent systems that turn model
  attributions into interpreted explanations, and I study when such
  explanations deserve trust. Before moving to Munich, I trained in
  geodesy, cartography and GIS at Wuhan University.

