bio: |
  I am a PhD student at the [Chair of Cartography and Visual Analytics](https://www.asg.ed.tum.de/lfk/home/)
  at the Technical University of Munich, supervised by Prof. Liqiu Meng and
  mentored by Prof. Yu Feng. I came to AI from maps. I studied geodesy,
  cartography and GIS at Wuhan University, where I first used language
  models to make sense of geospatial code, and I now spend most of my time
  on the AI side of GeoAI. Besides research, I supervise Master's students
  and maintain open learning resources on LLM agents and web scraping.

