name:
  display: 赵安琪
  alternate: Anqi Zhao
role: 地理空间人工智能方向博士生
bio: >-
  慕尼黑工业大学地图学与可视分析教席博士生，导师为孟立秋教授。研究位于机器学习与地理空间数据的交叉处，重点关注大语言模型智能体与可解释人工智能。一方面构建多智能体大语言模型系统，用于分析 GeoAI 模型并解释其行为；另一方面研究评测方法，检验这些解释能否真实反映模型学到的规律。在武汉大学期间，从事大小语言模型协同、从地学代码中抽取结构化知识的研究。

