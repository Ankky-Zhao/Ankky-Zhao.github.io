role: 地图学与 GeoAI 方向博士生
bio: >-
  慕尼黑工业大学地图学与可视分析教席博士生，导师为孟立秋教授。研究关注如何让地理空间人工智能的解释被模型领域之外的人读懂、核验并用于决策。目前构建基于大语言模型的多智能体系统，将模型归因结果转化为经过解读的解释，并探讨这类解释在何种条件下值得信任。本科与硕士阶段在武汉大学学习大地测量、地图学与地理信息系统。

